name: Reusable Lint (Web)
on:
  workflow_call: {}
jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prettify code
        uses: creyD/prettier_action@v4.6
        with:
          dry: True
          prettier_options: '**/*.{js,ts,jsx,tsx,cjs,cts,mjs,mts,json,vue,astro} --check'
